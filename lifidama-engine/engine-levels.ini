# LiFiDama engine presets; read by dama-linux at every invocation.
# These are indicative CPU time budgets, not hard wall-clock deadlines.
[beginner]
max_depth = 3
time_seconds = 0.15

[intermediate]
max_depth = 7
time_seconds = 0.30

[professional]
max_depth = 14
time_seconds = 0.50

[ultra]
max_depth = 20
time_seconds = 1.50
