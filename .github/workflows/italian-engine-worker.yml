name: Italian engine worker checks

on:
  push:
    branches: [feature/lifidama-italian-engine]
  pull_request:
    paths:
      - 'lifidama-engine/**'
      - 'modules/draughtsnet/src/main/MoveDB.scala'
      - 'modules/round/src/main/RoundDuct.scala'
      - '.github/workflows/italian-engine-worker.yml'

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python3 -m compileall -q lifidama-engine
      - name: Draughtsnet worker protocol unit tests
        working-directory: lifidama-engine
        run: python3 -m unittest -v test_worker.py

  scala-integration-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: sbt/setup-sbt@v1
      - name: Compile Draughtsnet and round modules (Scala 2.11 / sbt 0.13)
        run: sbt -batch 'draughtsnet/compile' 'round/compile'
